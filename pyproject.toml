[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-observability-from-first-principles"
version = "0.1.0"
description = "A real refund agent, made realistic, then given a camera (traces, cost) and a referee (evals, a release gate)."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "google-genai>=1.30,<3",
    "pydantic>=2.7",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["agent", "agentkit", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
